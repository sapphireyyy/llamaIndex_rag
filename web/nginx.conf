server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location = /runtime-config.js {
    alias /tmp/enterprise-rag-runtime/runtime-config.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, max-age=0" always;
  }
  location = /silent-check-sso.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, max-age=0" always;
  }
  location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http: https:; frame-src 'self' http: https:; form-action 'self' http: https:" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }
  location /api/ { proxy_pass http://enterprise-rag-api:8000; proxy_buffering off; }
  location /health/ { proxy_pass http://enterprise-rag-api:8000; }
}
