apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: enterprise-rag-encrypted
provisioner: csi.example.com
parameters:
  encrypted: "true"
  replication: "multi-zone"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: enterprise-rag-worker, namespace: enterprise-rag}
spec: {minAvailable: 1, selector: {matchLabels: {app: enterprise-rag-worker}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: enterprise-rag-worker, namespace: enterprise-rag}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: enterprise-rag-worker}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric: {name: enterprise_rag_queue_backlog}
        target: {type: AverageValue, averageValue: "50"}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-worker, namespace: enterprise-rag}
spec:
  podSelector: {matchLabels: {app: enterprise-rag-worker}}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 5672}
        - {protocol: TCP, port: 6333}
        - {protocol: TCP, port: 9200}
